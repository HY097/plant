name: Verify research app
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify figures and original research data
        run: python -m unittest discover -s tests -v
      - name: Check Streamlit pages
        run: python scripts/smoke_streamlit.py
